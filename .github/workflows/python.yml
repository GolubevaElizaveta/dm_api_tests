name: Python tests

on: [push, pull_request ]

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: action/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip incstall --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run:
          pytest ./tests